name: Pet - Build and push custom version to ECR

# Required GitHub Actions Environment Variables:
# - AWS_REGION, e.g. eu-north-1

# Required GitHub Actions Secrets:
# - ECR_ROLE_ARN_DEV, e.g. arn:aws:iam::123456789012:role/evaka-github-actions-role-dev
# - ECR_HOST_DEV, e.g. 123456789012.dkr.ecr.eu-north-1.amazonaws.com


on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'The branch, tag or SHA to checkout'
        required: true
        type: string
        default: 'master'
      imageTagSuffix:
        description: 'Suffix for ECR image tags. Tag names will be <ref>_<suffix> and <short_sha>_<suffix>'
        required: true
        type: string
        default: 'cust'
      pushToECR:
        description: 'Push images to the ECR'
        required: true
        type: boolean
        default: true
      deployToDev:
        description: 'Deploy new images into dev environment'
        required: true
        type: boolean
        default: true

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - name: "Cache bust"
        id: cache-bust
        run: echo "cache-bust=$(date '+%Y-%V')" >> "$GITHUB_OUTPUT"
    outputs:
      cache-bust: ${{ steps.cache-bust.outputs.cache-bust }}

  frontend-common:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs:
      - cache-bust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Configure AWS Credentials (Dev)
        if: inputs.pushToECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          mask-aws-account-id: true
          unset-current-credentials: true
          role-to-assume: ${{ secrets.ECR_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 1800 # Min is 900
          retry-max-attempts: 3
      - name: Login to ECR (Dev)
        if: inputs.pushToECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Docker metadata
        id: metadata
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ECR_HOST_DEV }}/evaka/frontend-common
          tags: |
            type=raw,value=${{ inputs.ref }}-${{ inputs.imageTagSuffix }}
            type=sha,format=short,prefix=,suffix=-${{ inputs.imageTagSuffix }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ inputs.pushToECR }}
          cache-from: type=gha,scope=frontend-common
          cache-to: type=gha,mode=max,scope=frontend-common
          build-args: 
            CACHE_BUST=${{ needs.cache-bust.outputs.cache-bust }}
            build=${{ github.run_number }}
            commit=${{ github.sha }}
            ICONS=free
          build-contexts: customizations=frontend/src/lib-customizations/espoo
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      
      - name: Update Amazon ECS task definition
        if: inputs.deployToDev
        id: render-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: evaka-frontend
          container-name: evaka-frontend
          image: ${{ fromJSON(steps.metadata.outputs.json).tags[1] }}
          
      - name: Deploy Amazon ECS task definition
        if: inputs.deployToDev
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-container.outputs.task-definition }}
          service: evaka-frontend
          cluster: evaka-dev
          wait-for-service-stability: true
      

  api-gateway:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs:
      - cache-bust
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (Dev)
        if: inputs.pushToECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          mask-aws-account-id: true
          unset-current-credentials: true
          role-to-assume: ${{ secrets.ECR_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 1800 # Min is 900
          retry-max-attempts: 3
      - name: Login to ECR (Dev)
        if: inputs.pushToECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Docker metadata
        id: metadata
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ECR_HOST_DEV }}/evaka/api-gateway
          tags: |
            type=raw,value=${{ inputs.ref }}-${{ inputs.imageTagSuffix }}
            type=sha,format=short,prefix=,suffix=-${{ inputs.imageTagSuffix }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./apigw
          push: ${{ inputs.pushToECR }}
          cache-from: type=gha,scope=apigw
          cache-to: type=gha,mode=max,scope=apigw
          build-args: 
            CACHE_BUST=${{ needs.cache-bust.outputs.cache-bust }}
            build=${{ github.run_number }}
            commit=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Update Amazon ECS task definition
        if: inputs.deployToDev
        id: render-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: evaka-apigw
          container-name: evaka-apigw
          image: ${{ fromJSON(steps.metadata.outputs.json).tags[1] }}
          
      - name: Deploy Amazon ECS task definition
        if: inputs.deployToDev
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-container.outputs.task-definition }}
          service: evaka-apigw
          cluster: evaka-dev
          wait-for-service-stability: true

  service:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs:
      - cache-bust
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (Dev)
        if: inputs.pushToECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          mask-aws-account-id: true
          unset-current-credentials: true
          role-to-assume: ${{ secrets.ECR_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 1800 # Min is 900
          retry-max-attempts: 3
      - name: Login to ECR (Dev)
        if: inputs.pushToECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Docker metadata
        id: metadata
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ECR_HOST_DEV }}/evaka/service
          tags: |
            type=raw,value=${{ inputs.ref }}-${{ inputs.imageTagSuffix }}
            type=sha,format=short,prefix=,suffix=-${{ inputs.imageTagSuffix }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: service/Dockerfile
          push: ${{ inputs.pushToECR }}
          cache-from: type=gha,scope=service
          cache-to: type=gha,mode=max,scope=service
          build-args: 
            CACHE_BUST=${{ needs.cache-bust.outputs.cache-bust }}
            build=${{ github.run_number }}
            commit=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Update Amazon ECS task definition
        if: inputs.deployToDev
        id: render-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: evaka-service
          container-name: evaka-service
          image: ${{ fromJSON(steps.metadata.outputs.json).tags[1] }}
          
      - name: Deploy Amazon ECS task definition
        if: inputs.deployToDev
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-container.outputs.task-definition }}
          service: evaka-service
          cluster: evaka-dev
          wait-for-service-stability: true

