      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./compose/db
          cache-from: type=gha,scope=test-db
          cache-to: type=gha,mode=max,scope=test-db
          build-args: 
            CACHE_BUST=${{ needs.cache-bust.outputs.cache-bust }}
            build=${{ github.run_number }}
            commit=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          push: true

      # - name: Update SSM Parameter Store
      #   id: update-ssm-parameter-store
      #   run: aws ssm put-parameter --name evaka_test_db_image --value ${{ fromJSON(steps.metadata.outputs.json).tags[1] }} --overwrite

      # - name: Update Amazon ECS task definition
      #   id: render-container
      #   uses: aws-actions/amazon-ecs-render-task-definition@v1
      #   with:
      #     task-definition-family: test-db
      #     container-name: test-db
      #     image: ${{ fromJSON(steps.metadata.outputs.json).tags[1] }}
          
      # - name: Deploy Amazon ECS task definition
      #   uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      #   with:
      #     task-definition: ${{ steps.render-container.outputs.task-definition }}
      #     service: test-db
      #     cluster: ${{ env.ECS_CLUSTER_NAME }}
      #     wait-for-service-stability: true

  dummy-idp:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'test' }}
    environment:
      name: ${{ github.ref_name }}
    permissions:
      id-token: write
      contents: read
    needs:
      - cache-bust
    steps:
      
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          mask-aws-account-id: true
          unset-current-credentials: true
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 1800 # Min is 900
          retry-max-attempts: 3

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Docker metadata
        id: metadata
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ECR_HOST }}/dummy-idp
