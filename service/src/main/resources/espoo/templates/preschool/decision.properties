decision.instructions.old=<p>Sovelletut oikeusohjeet:<br/> Perusopetuslaki 5, 6 ja 26 a § ja perusopetusasetus 23 a §<br/></p> <p> Päätöksessä ilmoitetun paikan <strong>vastaanottamis- tai kieltäytymisilmoitus on toimitettava välittömästi, viimeistään kahden viikon kuluessa</strong> tämän ilmoituksen saamisesta. Paikan voi käydä hyväksymässä/hylkäämässä sähköisesti osoitteessa <a href="https://evaka.petajavesi.fi" rel="noreferrer">evaka.petajavesi.fi</a> (vaatii tunnistautumisen).</p> <p>Tämä päätös poistaa lapsen esiopetushakemuksen.</p> <p>Toimivalta: Petäjäveden kunnan hallintosääntö</p>
